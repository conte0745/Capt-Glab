<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="color-scheme" content="light dark" />
		<style>
			body {
				display: flex;
				align-items: flex-start;
				gap: 10px;
				width: 280px;
				margin: 0;
				padding: 12px 14px;
				font-family: system-ui, sans-serif;
				font-size: 14px;
				line-height: 1.5;
			}
			img {
				width: 20px;
				height: 20px;
			}
			p {
				margin: 0;
			}
			#note {
				font-size: 12px;
				opacity: 0.75;
			}
			#message {
				flex: 1;
			}
			#settings {
				display: flex;
				flex: none;
				padding: 3px;
				border: 0;
				border-radius: 4px;
				background: transparent;
				color: inherit;
				opacity: 0.7;
				cursor: pointer;
			}
			#settings:hover,
			#settings:focus-visible {
				background: rgb(128 128 128 / 25%);
				opacity: 1;
			}
		</style>
		<title>CaptGrab</title>
	</head>
	<body>
		<img id="loading" src="../icons/loading.gif" alt="" />
		<div id="message">
			<p id="status" role="status">撮影中…</p>
			<p id="note"></p>
		</div>
		<button type="button" id="settings" title="設定" aria-label="設定を開く">
			<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<circle cx="12" cy="12" r="3" />
				<path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
			</svg>
		</button>
		<script type="module" src="./index.ts"></script>
	</body>
</html>
