<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>CaptGrab - 撮影した画像</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				margin: 0;
				font-family: system-ui, sans-serif;
				background: light-dark(#f4f4f4, #1e1e1e);
			}
			header {
				position: sticky;
				top: 0;
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				justify-content: space-between;
				gap: 8px 16px;
				padding: 10px 16px;
				background: light-dark(#fff, #2b2b2b);
				border-bottom: 1px solid light-dark(#ddd, #444);
			}
			.actions {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.actions[hidden] {
				display: none;
			}
			.actions {
				flex-wrap: wrap;
			}
			kbd {
				margin-left: 4px;
				font-family: ui-monospace, Menlo, Consolas, monospace;
				font-size: 11px;
				opacity: 0.7;
			}
			#toast {
				position: fixed;
				left: 50%;
				bottom: 20px;
				margin: 0;
				padding: 7px 16px;
				border-radius: 999px;
				background: light-dark(#111a3a, #fffdf5);
				color: light-dark(#fffdf5, #111a3a);
				font-size: 13px;
				transform: translateX(-50%);
			}
			#toast:empty {
				display: none;
			}
			button {
				padding: 6px 14px;
				border: 1px solid light-dark(#ccc, #555);
				border-radius: 4px;
				background: transparent;
				color: inherit;
				font: inherit;
				cursor: pointer;
			}
			main {
				padding: 16px;
				text-align: center;
			}
			img {
				max-width: 100%;
				height: auto;
				box-shadow: 0 1px 6px rgb(0 0 0 / 30%);
			}
		</style>
	</head>
	<body>
		<header>
			<span id="name">撮影した画像</span>
			<span class="actions">
				<span class="actions" id="actions" hidden>
					<button type="button" id="save">保存 <kbd>Ctrl+S</kbd></button>
					<button type="button" id="save-as">別名で保存 <kbd>Ctrl+Shift+S</kbd></button>
					<button type="button" id="copy">コピー <kbd>Ctrl+C</kbd></button>
				</span>
				<button type="button" id="settings">設定</button>
			</span>
		</header>
		<main>
			<p id="message" hidden>
				画像を表示できません。この画面は再読み込みすると画像が消えます。もう一度撮影してください。
			</p>
			<img id="image" alt="撮影したページ全体の画像" hidden />
		</main>
		<p id="toast" role="status"></p>
		<script type="module" src="./index.ts"></script>
	</body>
</html>
